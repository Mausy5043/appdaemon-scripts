# Project: homeassistant

# when changing dependencies also check `environment.yml`

[project]
name = "appdaemon-scripts"
version = "0.0.0"   # rolling release has no version
description = "AppDaemon scripts for Home Assistant"
dependencies = [
    "astral",
    "appdaemon",
]
license = {file = "LICENSE"}
authors = [
    {name = "Mausy5043"},
]
readme = "README.md"
requires-python = ">=3.12"

[tool.autopep8]
max_line_length = 112
in-place = true
recursive = true
aggressive = 2
ignore = [
    # whitespace before ':': is enforced by black
    "E203"
    ]

[tool.bandit]
exclude = ['*.py']
skips = ["B101"]
exclude_dirs = [
    ".venv/",
    "legacy/",
    ".local/"
]

[tool.black]
line-length = 112
target-version = ["py312"]
exclude = '''
/(
    \.venv/|
    legacy/|
    \.local/
)
'''

[tool.isort]
profile = "black"
py_version="auto"

[tool.flake8]
max_line_length = 112
ignore = [
    # function too complex: is what we do ;-)
    "C901",
    # whitespace before ':': is enforced by black
    "E203",
    # module level import not at top of file
    "E402",
    # line too long: is checked by pylint
    "E501",
    # do not use bare 'except':  don't care
    "E722",
    # line break before binary: is against policy.
    "W503",
]
exclude = [
    ".venv/",
    "legacy/",
    ".local/"
]

[tool.mypy]
exclude = [
    ".venv/",
    "legacy/",
    ".local/"
]
# ignore_errors = true
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
# disallow_untyped_calls = true
no_implicit_reexport = true
extra_checks = true

[tool.pydocstyle]
inherit = false
convention = "google"
match = ".*\\.py"
add-ignore = "D"

[tool.ruff]
fix = true
indent-width = 4
line-length = 112
output-format = "concise"
include = ["pyproject.toml", "git-apps/**/*.py"]
exclude = [
    ".venv/",
    "legacy/",
    ".local/",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]
ignore = [
    # line too long: formatter is leading
    "E501",
    # Return the condition `bool(___)` directly: prefer to use intermediate results
    "SIM103"
    ]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# pylint is controlled by .pylintrc


[tool.pyright]
pythonVersion = "3.12"
reportAttributeAccessIssue = "none"
reportAssignmentType = "none"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "bandit>=1.9.4",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pydocstyle>=6.3.0",
    "ruff>=0.16.5",
    "shellcheck-py>=0.11.0.1",
    "types-gunicorn>=26.2.0.20260827",
    "types-pysocks>=1.7.1.20260518",
    "types-python-dateutil>=2.9.0.20260807",
    "types-pytz>=2026.3.1.20260727",
    "types-pyyaml>=6.0.12.20260815",
    "types-requests>=2.33.0.20260712",
]
